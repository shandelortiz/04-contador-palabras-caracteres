<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/stylesheet.css">
    <title>Contador de palabras y caracteres</title>
</head>
<body>
    <div class="container">
        <h1>Contador de palabras y caracteres</h1>

        <!-- Area de texto donde el usuario escribira -->
        <textarea id="textInput" placeholder="Escribe algo aqui..."></textarea>

        <div class="results">
            <p>Palabras: <span id="wordCount"></span></p>
            <p>Caracteres: <span id="charCount"></span></p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
